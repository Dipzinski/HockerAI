<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/plotly.js/4.1.1/plotly-geo.min.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cdn.plot.ly; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HockerAI</title>
<meta name="description" content="Dust collection sales leads for Hocker North America, ranked from public OSHA and EPA records.">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/views.css">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<div class="app" id="app" data-view="home">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar glass" id="sidebar" aria-label="Sidebar">
    <a class="brand" href="#/home" aria-label="HockerAI home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6.5 7v10M10.5 7v10M14.5 7v10M18.5 7v10M4 4.5h17M4 19.5h17"/>
        </svg>
      </span>
      <span>
        <span class="brand-name" style="display:block">HockerAI</span>
        <span class="brand-sub">Dust collection leads</span>
      </span>
    </a>
    <nav id="sidebar-nav" aria-label="Folders and views"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <main class="content" id="content">
    <section class="view view-home" id="view-home" aria-label="Overview"></section>
    <section class="view view-leads" id="view-leads" aria-label="Leads">
      <div class="list-pane glass" id="list-pane"></div>
      <div class="detail-pane" id="detail-pane"></div>
    </section>
    <section class="view view-map" id="view-map" aria-label="Map"></section>
    <section class="view view-scoring" id="view-scoring" aria-label="How scoring works"></section>
    <div class="state-msg" id="state-msg" role="status"><span>Loading leads…</span></div>
  </main>

  <nav class="tabbar glass" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This dashboard needs JavaScript. The same leads are in outputs/leads.csv in the repository.</p></noscript>
</body>
</html>
